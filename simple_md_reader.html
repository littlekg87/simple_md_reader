<script>
  // 첫 화면 깜빡임 방지: 저장된 테마를 먼저 적용
  try {
    const p = JSON.parse(localStorage.getItem('mdr-prefs') || '{}'), r = document.documentElement;
    if (p.theme === 'custom' && p.custom) {
      const n = parseInt(p.custom.bg.slice(1), 16);
      r.dataset.theme = ((n >> 16 & 255) * .299 + (n >> 8 & 255) * .587 + (n & 255) * .114) < 110 ? 'dark' : 'light';
      r.style.setProperty('--bg', p.custom.bg);
      r.style.setProperty('--text', p.custom.text);
    } else r.dataset.theme = p.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const w = innerWidth, ui = !p.ui || p.ui === 'auto' ? (w >= 3000 ? 1.75 : w >= 2400 ? 1.5 : w >= 1900 ? 1.25 : 1) : +p.ui;
    r.style.fontSize = 16 * ui + 'px';
  } catch { document.documentElement.dataset.theme = 'light'; }
</script>

<style>
:root {

.sidebar { grid-column: 1; grid-row: 1; }

}

main { overflow: auto; min-width: 0; position: relative; }

/* ── 본문 ── */
.doc {

  font-family: var(--font-body); font-size: var(--fs); line-height: var(--lh);

}
.doc > :first-child { margin-top: 0; }
.doc h1, .doc h2, .doc h3, .doc h4, .doc h5, .doc h6 { font-weight: 700; line-height: 1.35; scroll-margin-top: 1.5rem; letter-spacing: -.01em; }
.doc h1 { font-size: 1.9em; margin: 1.6em 0 .8em; letter-spacing: -.02em; }
.doc h2 { font-size: 1.45em; margin: 2em 0 .7em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }

.doc p { margin: 0 0 1em; }
.doc a { color: var(--accent); text-decoration: underline; text-underline-offset: 0.1875rem; text-decoration-thickness: 1px; }
.doc ul, .doc ol { padding-left: 1.6em; margin: 0 0 1em; }
.doc li { margin: .25em 0; }

.doc blockquote { margin: 1.2em 0; padding: .5em 1.1em; border-left: 0.1875rem solid var(--accent); background: var(--surface); color: var(--muted); border-radius: 0 0.375rem 0.375rem 0; }
.doc blockquote > :last-child { margin-bottom: 0; }
.doc hr { border: 0; border-top: 1px solid var(--border); margin: 2.4em 0; }

.doc pre code { background: none; padding: 0; font-size: .84em; white-space: pre; word-break: normal; }
.doc pre[data-lang]::before { content: attr(data-lang); position: absolute; top: 0.3125rem; right: 0.625rem; font-size: 0.6875rem; color: var(--faint); font-family: var(--font-ui); }
.doc img { max-width: 100%; height: auto; border-radius: 0.375rem; }
.doc mark { background: var(--mark); color: inherit; padding: 0 .15em; border-radius: 0.1875rem; }
.doc kbd { font-family: var(--font-mono); font-size: .82em; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 0.25rem; padding: .05em .4em; background: var(--surface); }
.doc details { margin: 1em 0; padding: .6em 1em; border: 1px solid var(--border); border-radius: 0.5rem; }

/* 표 */
.table-wrap { overflow-x: auto; margin: 1.3em 0; border: 1px solid var(--border); border-radius: 0.5rem; }
.doc table { border-collapse: collapse; width: 100%; font-size: .9em; line-height: 1.55; }
.doc th, .doc td { padding: .55em .85em; border-bottom: 1px solid var(--border); vertical-align: top; text-align: left; }
.doc th + th, .doc td + td { border-left: 1px solid var(--border); }
.doc thead th { background: var(--th-bg); font-weight: 650; white-space: nowrap; }
.doc tbody tr:nth-child(even) { background: var(--row-alt); }
.doc tbody tr:hover { background: var(--accent-soft); }
.doc tbody tr:last-child td { border-bottom: 0; }
.doc td code, .doc th code { white-space: nowrap; }

/* 각주 */
.doc .footnote-ref a { text-decoration: none; font-size: .78em; font-weight: 600; padding: 0 .2em; border-radius: 0.1875rem; }
.doc .footnote-ref a:hover { background: var(--accent-soft); }
.doc .footnotes-sep { margin: 3em 0 1.2em; }
.doc .footnotes { font-size: .88em; color: var(--muted); }
.doc .footnotes li { margin: .4em 0; }
.doc .footnotes li:target { color: var(--text); }
.doc .footnote-backref { text-decoration: none; margin-left: .3em; }
.fnpop {
  position: fixed; z-index: 40; max-width: min(27.5rem, 90vw); padding: 0.625rem 0.875rem; border: 1px solid var(--border);
  border-radius: 0.5rem; background: var(--bg); box-shadow: var(--shadow); font-family: var(--font-body);

.doc .math.display { display: block; margin: 1.2em 0; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }

/* 코드 색 */
.hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-section, .hljs-link, .hljs-doctag { color: var(--hl-kw); }
.hljs-string, .hljs-regexp, .hljs-addition, .hljs-template-tag { color: var(--hl-str); }

.hljs-comment, .hljs-quote { color: var(--hl-com); font-style: italic; }

.hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable, .hljs-property, .hljs-params { color: var(--hl-attr); }

  padding: 2.75rem 2.75rem 35vh; border: 0; outline: 0; resize: none; overflow: hidden;
  background: transparent; color: var(--text); caret-color: var(--accent);
  font-family: var(--font-mono); font-size: calc(var(--fs) * .9); line-height: 1.7; tab-size: 4;
  white-space: pre-wrap; overflow-wrap: break-word; word-break: normal;
}
.editor::selection { background: var(--accent-soft); }
.mirror { position: absolute; visibility: hidden; left: -99999px; top: 0; white-space: pre-wrap; overflow-wrap: break-word; }

/* ── 첫 화면 ── */
.welcome { max-width: 47.5rem; margin: 8vh auto 0; padding: 0 1.5rem 3.75rem; text-align: center; }
.features-title { margin: 2.75rem 0 0.875rem; font-size: 1.125rem; font-weight: 700; letter-spacing: -.01em; }
.features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; text-align: left; }
.feat { padding: 1.125rem 1.125rem 1rem; border: 1px solid var(--border); border-radius: 0.75rem; background: var(--surface); }
.feat .ic { width: 2.625rem; height: 2.625rem; border-radius: 0.6875rem; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; margin-bottom: 0.75rem; }
.feat .ic svg { width: 1.4375rem; height: 1.4375rem; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.feat h3 { margin: 0 0 0.3125rem; font-size: 0.9688rem; letter-spacing: -.01em; }
.feat p { margin: 0; font-size: 0.8438rem; color: var(--muted); line-height: 1.6; word-break: keep-all; }
@media (max-width: 900px) { .features { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) { .features { grid-template-columns: 1fr; } }
.welcome h1 { font-size: 1.75rem; margin: 0 0 0.625rem; letter-spacing: -.02em; }
.ver-tag {
  display: inline-block; vertical-align: middle; margin-left: 0.375rem; padding: 0.1875rem 0.5625rem; border-radius: 62.4375rem;
  background: var(--accent-soft); color: var(--accent); font-size: 0.8125rem; font-weight: 600; letter-spacing: 0;
  text-decoration: none; font-family: var(--font-ui);
}
.ver-tag:hover { text-decoration: underline; }
.welcome .lead { color: var(--muted); font-size: 1rem; line-height: 1.7; margin: 0 0 1.75rem; word-break: keep-all; }
.welcome .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 0.625rem; }
.welcome .hint { color: var(--faint); font-size: 0.9062rem; margin-top: 0.875rem; }
.welcome .recent { margin: 2.125rem auto 0; text-align: left; max-width: 27.5rem; }
.welcome .recent h2 { font-size: 0.8438rem; color: var(--faint); font-weight: 700; margin: 0 0 0.375rem 0.625rem; letter-spacing: .04em; }
.keys { margin: 2.5rem auto 0; text-align: left; display: grid; grid-template-columns: auto 1fr; gap: 0.625rem 1.125rem; font-size: 0.9062rem; color: var(--muted); max-width: 25rem; }
.keys kbd, .pop-keys kbd { font-family: var(--font-mono); font-size: 0.8125rem; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 0.25rem; padding: 2px 0.4375rem; background: var(--surface); color: var(--text); white-space: nowrap; justify-self: start; }
.credit { margin-top: 2.75rem; padding-top: 1.125rem; border-top: 1px solid var(--border); font-size: 0.8438rem; color: var(--faint); line-height: 1.75; word-break: keep-all; }
.credit a, .pop-credit a { color: var(--accent); }
.credit b, .pop-credit b { color: var(--muted); }

/* ── 보기 설정 ── */
.popover {
  position: fixed; z-index: 30; width: 22.5rem; padding: 1.125rem; border: 1px solid var(--border);
  border-radius: 0.75rem; background: var(--bg); box-shadow: var(--shadow); font-size: 0.9062rem;
  max-height: calc(100vh - 5rem); overflow: auto;
}
.pop-row { margin-bottom: 1rem; }
.pop-label { color: var(--muted); font-size: 0.8438rem; font-weight: 600; margin-bottom: 0.375rem; }
.seg { display: flex; background: var(--surface); border-radius: 0.5rem; padding: 0.1875rem; gap: 2px; }
.seg button { flex: 1; border: 0; background: none; color: var(--muted); height: 2.125rem; border-radius: 0.375rem; cursor: pointer; font-size: 0.875rem; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--bg); color: var(--text); font-weight: 600; box-shadow: 0 1px 0.1875rem rgba(0,0,0,.12); }
.sidebar .seg { background: var(--surface-2); }
.pop-sub { margin-top: 0.625rem; padding: 0.75rem; border-radius: 0.625rem; background: var(--surface); display: grid; gap: 0.625rem; }
.pop-sub input:not([type]), .pop-sub input[list] {
  width: 100%; box-sizing: border-box; height: 2.375rem; padding: 0 0.75rem; border: 1px solid var(--border);
  border-radius: 0.5rem; background: var(--bg); color: var(--text); font-size: 0.9375rem; outline: none;
}
.pop-sub input[list]:focus { border-color: var(--accent); }
.pop-sub .wbtn { height: 2.25rem; font-size: 0.8438rem; }
.color-row { display: flex; align-items: center; gap: 0.625rem; cursor: pointer; }
.color-row span { width: 4rem; color: var(--muted); font-size: 0.8438rem; font-weight: 600; }
.color-row input[type="color"] { width: 2.75rem; height: 2rem; padding: 2px; border: 1px solid var(--border); border-radius: 0.5rem; background: var(--bg); cursor: pointer; }
.color-row code { font-family: var(--font-mono); font-size: 0.8125rem; color: var(--muted); }
.pop-sub .pop-label { margin: 2px 0 -4px; }
.swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.375rem; }
.swatches button {
  height: 2.5rem; border: 1px solid var(--border); border-radius: 0.5rem; cursor: pointer;
  font-size: 0.8125rem; font-weight: 600; display: flex; align-items: center; justify-content: center;
}
.swatches button.on { outline: 2px solid var(--accent); outline-offset: 1px; }
.pop-sub .warn { margin: 0; font-size: 0.8125rem; color: var(--danger); line-height: 1.5; }
.pop-size { display: flex; align-items: center; gap: 0.375rem; }
.pop-size .size-val { flex: 1; font-size: 1rem; color: var(--text); }
.pop-keys { border-top: 1px solid var(--border); padding-top: 0.75rem; display: grid; grid-template-columns: auto 1fr; gap: 0.5rem 0.75rem; color: var(--muted); font-size: 0.875rem; }
.pop-credit { border-top: 1px solid var(--border); margin-top: 0.875rem; padding-top: 0.75rem; font-size: 0.7812rem; color: var(--faint); line-height: 1.65; word-break: keep-all; }

.modal-back { position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; padding: 1rem; background: rgba(0,0,0,.32); }
.modal { width: min(27.5rem, 100%); box-sizing: border-box; padding: 1.5rem 1.5rem 1.25rem; border: 1px solid var(--border); border-radius: 0.875rem; background: var(--bg); box-shadow: var(--shadow); }
.modal-msg { margin: 0 0 0.375rem; font-size: 1.0312rem; font-weight: 700; line-height: 1.5; word-break: keep-all; }
.modal-sub { margin: 0 0 1.375rem; font-size: 0.9062rem; color: var(--muted); line-height: 1.6; word-break: keep-all; }
.modal-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.5rem; }
.modal.about { position: relative; width: min(37.5rem, 100%); max-height: 86vh; overflow: auto; padding: 1.75rem 1.875rem 1.5rem; font-size: 0.9062rem; line-height: 1.65; word-break: keep-all; }
.about-close { position: absolute; top: 0.75rem; right: 0.75rem; }
.about h2 { margin: 0; font-size: 1.375rem; letter-spacing: -.01em; font-family: var(--font-mono); }
.about .ver { margin: 2px 0 0.75rem; color: var(--faint); font-size: 0.8438rem; }
.about .desc { margin: 0 0 1.25rem; color: var(--muted); }
.about dl { display: grid; grid-template-columns: 7rem 1fr; gap: 0.75rem 1rem; margin: 0; padding: 1.125rem 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.about dt { color: var(--faint); font-weight: 600; font-size: 0.8438rem; padding-top: 1px; }
.about dd { margin: 0; }
.about dd .sub { color: var(--muted); font-size: 0.8438rem; }
.about ul { margin: 0.25rem 0 0; padding-left: 1.2em; }
.about li { margin: 2px 0; }
.about a { color: var(--accent); }
.about .oss { margin: 1rem 0 0; font-size: 0.8125rem; color: var(--faint); }
.about .oss b { color: var(--muted); }
.about .copy { margin: 0.875rem 0 0; font-size: 0.8125rem; color: var(--faint); }
.credit a[data-about], .pop-credit a[data-about] { cursor: pointer; }
@media (max-width: 560px) { .about dl { grid-template-columns: 1fr; gap: 2px 0; } .about dd { margin-bottom: 0.625rem; } }

.toast {
  position: fixed; left: 50%; bottom: 1.75rem; transform: translate(-50%, 1.25rem); opacity: 0; pointer-events: none;
  background: var(--text); color: var(--bg); padding: 0.6875rem 1.125rem; border-radius: 0.5625rem; font-size: 0.9375rem;
  transition: opacity .2s, transform .2s; z-index: 50; max-width: 80vw;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.dropzone {
  position: fixed; inset: 0.625rem; z-index: 60; display: none; align-items: center; justify-content: center;
  border: 2px dashed var(--accent); border-radius: 1rem; background: color-mix(in srgb, var(--bg) 88%, transparent);
  color: var(--accent); font-size: 1.125rem; font-weight: 600; pointer-events: none;
}
body.dropping .dropzone { display: flex; }

@media print {
  .topbar, .sidebar, .toc, .banner, .toast, .fnpop, .popover { display: none !important; }
  body { display: block; height: auto; overflow: visible; }
  .layout { display: block; }

  .doc { max-width: none; padding: 0; }

}

// ── 설정 ──
const DEFAULTS = {

  custom: { bg: '#f4ecd8', text: '#3b2f1e' }, customFont: '', ui: 'auto', preview: false,

// 화면 배율: 메뉴·버튼·목록 크기 (본문 글자 크기와는 따로). '자동'은 창 폭에 맞춰 고른다

const uiScale = () => prefs.ui === 'auto' ? autoUiScale() : (+prefs.ui || 1);
const SWATCHES = [
  ['swPaper', '#fbfaf7', '#1f1d1a'], ['swSepia', '#f4ecd8', '#3b2f1e'], ['swGreen', '#e6efdf', '#22301c'], ['swGray', '#e4e4e2', '#232323'],
  ['swNavy', '#1d2433', '#d6dde8'], ['swInk', '#141414', '#d8d2c4'], ['swNight', '#0f1a14', '#b9d8c2'], ['swContrast', '#000000', '#ffffff'],
];

const CUSTOM_MIX = { '--surface': 4, '--surface-2': 9, '--edit-bg': 2, '--muted': 68, '--faint': 48, '--border': 15, '--code-bg': 6, '--th-bg': 8, '--row-alt': 3 };
const WIDTHS = { narrow: '660px', normal: '820px', wide: '1080px', full: '100vw' };
const FONTS = {
  sans: '"Pretendard Variable", Pretendard, "Malgun Gothic", sans-serif',
  malgun: '"Malgun Gothic", "맑은 고딕", sans-serif',
  serif: '"Noto Serif KR", "Nanum Myeongjo", Batang, serif',

const LHS = { tight: 1.6, normal: 1.8, loose: 2.05 };

try { Object.assign(prefs, JSON.parse(localStorage.getItem('mdr-prefs') || '{}')); } catch {}
const savePrefs = () => { try { localStorage.setItem('mdr-prefs', JSON.stringify(prefs)); } catch {} };
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
const theme = () => prefs.theme || (darkMQ.matches ? 'dark' : 'light');   // light | dark | custom
function luminance(hex) {

  const [r, g, b] = [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => (v /= 255) <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4);

const t = (k, v = {}) => (I18N[prefs.lang]?.[k] ?? I18N.ko[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
const creditHtml = () => t('credit', { year: YEAR, github: GITHUB });

// ── 마크다운 ──
function mathPlugin(md) {
  function inline(state, silent) {
    const src = state.src, s = state.pos, max = state.posMax;
    if (src.charCodeAt(s) !== 0x24) return false;
    const display = src.charCodeAt(s + 1) === 0x24;
    const w = display ? 2 : 1;
    if (s + w >= max) return false;
    if (!display && /\s/.test(src[s + 1])) return false;
    let p = s + w, end = -1;
    while (p < max) {
      const i = src.indexOf(display ? '$$' : '$', p);
      if (i < 0 || i >= max) break;
      if (src[i - 1] === '\\') { p = i + 1; continue; }
      end = i; break;
    }
    if (end <= s + w) return false;
    if (!display && (/\s/.test(src[end - 1]) || /\d/.test(src[end + 1] || ''))) return false;
    if (!silent) {
      const tk = state.push('math_inline', '', 0);
      tk.content = src.slice(s + w, end);
      tk.meta = { display };
    }
    state.pos = end + w;
    return true;
  }
  function block(state, startLine, endLine, silent) {
    if (state.sCount[startLine] - state.blkIndent >= 4) return false;
    const lineText = n => state.src.slice(state.bMarks[n] + state.tShift[n], state.eMarks[n]);
    const first = lineText(startLine);
    if (!first.startsWith('$$')) return false;
    const rest = first.slice(2).trim();
    let content, last = startLine;
    if (rest.endsWith('$$')) {
      content = rest.slice(0, -2);
    } else {
      const lines = rest ? [rest] : [];
      let found = false;
      for (last = startLine + 1; last < endLine; last++) {
        const tx = lineText(last).trim();
        if (tx.endsWith('$$')) { lines.push(tx.slice(0, -2)); found = true; break; }
        lines.push(tx);
      }
      if (!found) return false;
      content = lines.join('\n');
    }
    if (silent) return true;
    state.line = last + 1;
    const tk = state.push('math_block', '', 0);
    tk.block = true; tk.content = content; tk.map = [startLine, state.line];
    return true;
  }
  md.inline.ruler.after('escape', 'math_inline', inline);
  md.block.ruler.before('fence', 'math_block', block, { alt: ['paragraph', 'reference', 'blockquote', 'list'] });
  md.renderer.rules.math_inline = (tk, i, o, env) =>
    `<span class="math${tk[i].meta.display ? ' display' : ''}" data-i="${env.math.push(tk[i].content) - 1}"></span>`;
  md.renderer.rules.math_block = (tk, i, o, env) =>
    `<div class="math display" data-line="${tk[i].map[0]}" data-i="${env.math.push(tk[i].content) - 1}"></div>\n`;
}

const md = window.markdownit({ html: true, linkify: true, typographer: false });
md.use(window.markdownitFootnote).use(mathPlugin);
md.renderer.rules.footnote_caption = (tk, i) => {
  let n = String(tk[i].meta.id + 1);
  if (tk[i].meta.subId > 0) n += ':' + tk[i].meta.subId;
  return n;
};
md.renderer.rules.fence = (tokens, i, opts, env) => {
  const tk = tokens[i];
  const lang = (tk.info || '').trim().split(/\s+/)[0].toLowerCase();
  const line = tk.map ? tk.map[0] : '';
  if (lang === 'mermaid')
    return `<div class="mermaid-block" data-line="${line}" data-i="${env.mermaid.push(tk.content) - 1}"></div>\n`;
  if (lang === 'math' || lang === 'latex')
    return `<div class="math display" data-line="${line}" data-i="${env.math.push(tk.content) - 1}"></div>\n`;
  let body = null;
  if (lang && hljs.getLanguage(lang)) {
    try { body = hljs.highlight(tk.content, { language: lang, ignoreIllegals: true }).value; } catch {}
  }
  return `<pre data-line="${line}"${lang ? ` data-lang="${esc(lang)}"` : ''}><code class="hljs">${body ?? esc(tk.content)}</code></pre>\n`;
};
// 블록마다 원문 줄 번호를 달아 둔다 (읽기↔편집 위치 맞추기용)
md.core.ruler.push('src_line', state => {
  for (const tk of state.tokens) if (tk.map && tk.nesting === 1) tk.attrSet('data-line', String(tk.map[0]));
});

// ── 외부 라이브러리 지연 로딩 ──
const loading = {};
function loadScript(src) {
  return loading[src] ||= new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res;
    s.onerror = () => { delete loading[src]; rej(new Error('load failed: ' + src)); };
    document.head.append(s);
  });
}
function loadCss(href) {
  if (loading[href]) return;
  loading[href] = true;
  const l = document.createElement('link');
  l.rel = 'stylesheet'; l.href = href;
  document.head.append(l);
}

async function renderMath(box, env) {
  const els = box.querySelectorAll('.math[data-i]');
  if (!els.length) return;
  try { loadCss(CDN.katexCss); await loadScript(CDN.katexJs); }
  catch { els.forEach(el => { el.textContent = env.math[+el.dataset.i]; }); return; }
  for (const el of els) {
    katex.render(env.math[+el.dataset.i], el, { displayMode: el.classList.contains('display'), throwOnError: false });
  }
}

let mermaidTheme = null, mmdN = 0;
const mmdCache = new Map();
async function renderMermaid(box, env) {
  const els = box.querySelectorAll('.mermaid-block[data-i]');
  if (!els.length) return;
  try { await loadScript(CDN.mermaid); }
  catch { els.forEach(el => { el.innerHTML = `<div class="render-err">${esc(t('mermaidLoad'))}</div>`; }); return; }
  const th = baseTheme();
  if (mermaidTheme !== th) {
    mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: th === 'dark' ? 'dark' : 'default', fontFamily: 'Pretendard Variable, Malgun Gothic, sans-serif' });
    mermaidTheme = th;
  }
  for (const el of els) {
    const src = env.mermaid[+el.dataset.i];
    const key = th + '\0' + src;
    let svg = mmdCache.get(key);
    if (!svg) {
      const id = 'mmd' + (++mmdN);
      try {
        ({ svg } = await mermaid.render(id, src));
        mmdCache.set(key, svg);
      } catch (e) {
        document.getElementById('d' + id)?.remove();
        el.innerHTML = `<div class="render-err"><b>${esc(t('mermaidErr'))}</b><pre>${esc(String(e.message || e).slice(0, 600))}</pre></div>`;
        continue;
      }
    }
    el.innerHTML = svg;
  }
}

// ── 경로 ──
function joinPath(base, rel) {
  let r = rel;
  try { r = decodeURIComponent(rel); } catch {}
  const out = r.startsWith('/') ? [] : base.split('/').slice(0, -1);
  for (const seg of r.split('/')) {
    if (!seg || seg === '.') continue;
    if (seg === '..') { if (!out.length) return null; out.pop(); }
    else out.push(seg);
  }
  return out.join('/');
}
async function fileByPath(path) {
  if (!S.root || path == null) return null;
  const segs = path.split('/');
  try {
    let d = S.root;
    for (const s of segs.slice(0, -1)) d = await d.getDirectoryHandle(s);
    return await d.getFileHandle(segs[segs.length - 1]);
  } catch { return null; }
}
async function sameEntry(a, b) {
  try { return await a.isSameEntry(b); } catch { return false; }
}
// 파일 핸들이 지금 연 폴더 안에 있으면 폴더의 항목으로 (이미지·링크가 동작), 아니면 단독 파일로
async function nodeFor(h) {
  if (S.root) {
    try {
      const parts = await S.root.resolve(h);
      const n = parts && S.byPath.get(parts.join('/'));
      if (n) return n;
    } catch {}
  }
  return { kind: 'file', name: h.name, handle: h, path: h.name, single: true };
}

const blobUrls = new Map();
async function resolveImages(box) {
  if (!S.cur || !S.root || S.cur.node.single) return;
  const jobs = [];
  for (const img of box.querySelectorAll('img[src]')) {
    const src = img.getAttribute('src');
    if (/^([a-z][a-z0-9+.-]*:|\/\/)/i.test(src)) continue;
    const path = joinPath(S.cur.path, src.split(/[?#]/)[0]);
    jobs.push((async () => {
      let url = blobUrls.get(path);
      if (!url) {
        const h = await fileByPath(path);
        if (!h) return;
        url = URL.createObjectURL(await h.getFile());
        blobUrls.set(path, url);
      }
      img.src = url;
    })());
  }
  await Promise.all(jobs);
}

// ── 읽기 화면 그리기 ──
let renderSeq = 0;
async function renderDoc(text, { keepScroll = false } = {}) {
  const seq = ++renderSeq;
  const busyTimer = setTimeout(() => { $('#busy').hidden = false; }, 250);
  const env = { math: [], mermaid: [] };
  let html;
  try { html = md.render(text, env); }
  catch (e) { html = `<div class="render-err">${esc(t('parseErr', { msg: e.message }))}</div>`; }
  const box = document.createElement('article');
  box.className = 'doc'; box.id = 'doc';
  box.innerHTML = DOMPurify.sanitize(html, { ADD_ATTR: ['target'] });
  decorate(box);
  await Promise.all([renderMath(box, env), renderMermaid(box, env), resolveImages(box)]);
  clearTimeout(busyTimer);
  if (seq !== renderSeq) return;
  $('#busy').hidden = true;
  const top = main.scrollTop, previewTop = docEl.scrollTop;
  box.hidden = S.mode === 'edit' && !prefs.preview;
  docEl.replaceWith(box);
  docEl = box;
  buildToc();
  if (keepScroll) main.scrollTop = top;
  if (splitOn()) box.scrollTop = previewTop;
}

// ── 나란히 미리보기 ──
const splitOn = () => S.mode === 'edit' && prefs.preview;
let previewTimer, previewRaf = 0;
function schedulePreview() {
  if (!splitOn()) return;
  clearTimeout(previewTimer);
  previewTimer = setTimeout(async () => { await renderDoc(S.cur.text); syncPreview(); }, 250);
}
// 원문에서 맨 위에 보이는 줄에 맞춰 미리보기를 스크롤한다
function syncPreview() {
  previewRaf = 0;
  if (!splitOn() || innerWidth <= 900) return;
  const { line } = topVisibleEditorLine();
  let best = null;
  for (const el of docEl.querySelectorAll('[data-line]')) if (+el.dataset.line <= line) best = el;
  docEl.scrollTop = best ? docEl.scrollTop + best.getBoundingClientRect().top - docEl.getBoundingClientRect().top - 16 : 0;
}
async function togglePreview() {
  if (!S.cur || S.screen) return;
  if (S.mode !== 'edit') { prefs.preview = true; savePrefs(); enterEdit(); return; }
  prefs.preview = !prefs.preview;
  savePrefs();
  docEl.hidden = !prefs.preview;
  updateModeBtn();
  autosize();
  if (prefs.preview) { await renderDoc(S.cur.text); syncPreview(); }
  editor.focus({ preventScroll: true });
}

function decorate(box) {
  const used = new Set();
  for (const h of box.querySelectorAll('h1,h2,h3,h4,h5,h6')) {
    const base = headingText(h).toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-+|-+$/g, '') || 'section';
    let id = base, n = 1;
    while (used.has(id)) id = `${base}-${++n}`;
    used.add(id);
    if (!h.id) h.id = id;
  }
  for (const tb of box.querySelectorAll('table')) {
    const w = document.createElement('div');
    w.className = 'table-wrap';
    tb.replaceWith(w); w.append(tb);
  }
  for (const a of box.querySelectorAll('a[href]')) {
    if (/^(https?:|mailto:)/i.test(a.getAttribute('href'))) { a.target = '_blank'; a.rel = 'noopener'; }
  }
}
function headingText(h) {
  const c = h.cloneNode(true);
  c.querySelectorAll('.footnote-ref').forEach(x => x.remove());
  return c.textContent.trim();
}

// ── 목차 ──
let tocHeads = [];
function buildToc() {
  tocHeads = S.screen ? [] : [...docEl.querySelectorAll('h1,h2,h3,h4')];
  tocList.innerHTML = '';
  if (!tocHeads.length) { tocList.innerHTML = `<p class="toc-empty">${S.cur && !S.screen ? esc(t('tocEmpty')) : ''}</p>`; return; }
  const min = Math.min(...tocHeads.map(h => +h.tagName[1]));
  for (const h of tocHeads) {
    const b = document.createElement('button');
    b.className = 'toc-item';
    b.style.paddingLeft = (.75 + (+h.tagName[1] - min)) + 'rem';
    b.textContent = headingText(h);
    b.title = b.textContent;
    b.onclick = () => {
      if (S.mode === 'edit') scrollEditorToLine(+h.dataset.line, 24);
      else main.scrollTo({ top: main.scrollTop + h.getBoundingClientRect().top - main.getBoundingClientRect().top - 16 });
    };
    tocList.append(b);
  }
  updateSpy();
}
let spyRaf = 0;
function updateSpy() {
  spyRaf = 0;
  if (S.mode !== 'read' || !tocHeads.length) return;
  const limit = main.getBoundingClientRect().top + Math.min(240, main.clientHeight * .3);
  let idx = 0;
  tocHeads.forEach((h, i) => { if (h.getBoundingClientRect().top <= limit) idx = i; });
  const items = tocList.children;
  for (let i = 0; i < items.length; i++) items[i].classList.toggle('active', i === idx);
  items[idx]?.scrollIntoView({ block: 'nearest' });
}

async function addRecent(node) {

async function ensurePerm(h) {

async function walk(dir, prefix) {
  const dirs = [], files = [], subs = [];
  for await (const [name, h] of dir.entries()) {
    if (name.startsWith('.') || SKIP_DIRS.has(name)) continue;
    if (h.kind === 'directory') subs.push(walk(h, prefix + name + '/').then(n => { if (n.children.length) dirs.push(n); }));
    else if (MD_RE.test(name)) files.push({ kind: 'file', name, handle: h, path: prefix + name });
  }
  await Promise.all(subs);
  const cmp = (a, b) => a.name.localeCompare(b.name, 'ko', { numeric: true });
  return { kind: 'dir', name: dir.name, handle: dir, path: prefix, children: [...dirs.sort(cmp), ...files.sort(cmp)] };
}
async function refreshTree() {
  if (!S.root) return;
  let tree;
  try { tree = await walk(S.root, ''); }
  catch { toast(t('readFolderFail')); return; }
  S.tree = tree; S.files = []; S.byPath = new Map();
  (function flat(d) { for (const c of d.children) c.kind === 'dir' ? flat(c) : (S.files.push(c), S.byPath.set(c.path, c)); })(tree);
  if (S.cur?.node.handle) {
    S.cur.node = await nodeFor(S.cur.node.handle);
    S.cur.path = S.cur.node.path;
  }
  renderSide(); updateCrumb();
}
function renderTree() {
  const el = $('#tree');
  el.innerHTML = '';
  if (!S.root) {
    el.innerHTML = `<div class="tree-empty">${esc(t('noFolder'))}</div>`;
    const box = el.firstChild;

  }
  const head = document.createElement('div');
  head.className = 'tree-root';
  head.innerHTML = ICON.folder + esc(S.root.name);
  head.title = S.root.name;
  el.append(head);
  const q = $('#filter').value.trim().toLowerCase();
  if (q) {
    const hits = S.files.filter(n => n.path.toLowerCase().includes(q));
    for (const n of hits) el.append(fileRow(n, 0, true));
    if (!hits.length) el.insertAdjacentHTML('beforeend', `<div class="tree-empty">${esc(t('noMatch'))}</div>`);
    return;
  }
  if (!S.files.length) { el.insertAdjacentHTML('beforeend', `<div class="tree-empty">${esc(t('noMd'))}</div>`); return; }
  (function draw(dir, depth) {
    for (const c of dir.children) {
      if (c.kind === 'dir') {
        const open = S.open.has(c.path);
        const b = document.createElement('button');

        b.onclick = () => { open ? S.open.delete(c.path) : S.open.add(c.path); renderTree(); };
        el.append(b);
        if (open) draw(c, depth + 1);
      } else el.append(fileRow(c, depth));

  })(S.tree, 0);
}

const norm = s => s.replace(/\r\n/g, '\n');

// 확인창: buttons = [{ label, value, primary, danger }], Esc나 바깥 클릭은 'cancel'
// opts.input이 있으면 입력 칸을 보여 주고, 입력한 값을 opts.value에 담는다
function ask(msg, sub, buttons, opts = {}) {
  return new Promise(res => {
    const modal = $('#modal'), box = $('#modal-actions');
    $('#modal-msg').textContent = msg;
    $('#modal-sub').textContent = sub || '';
    box.innerHTML = '';
    let input = null;
    if (opts.input != null) {
      input = document.createElement('input');
      input.className = 'modal-input';
      input.value = opts.input;
      input.spellcheck = false;
      input.onkeydown = e => {
        const p = buttons.find(b => b.primary);
        if (e.key === 'Enter' && p) { e.preventDefault(); done(p.value); }
      };
      box.before(input);
    }
    const done = v => {
      if (input) { opts.value = input.value; input.remove(); }
      modal.hidden = true;
      document.removeEventListener('keydown', onKey, true);
      modal.onclick = null;
      res(v);
    };
    const onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done('cancel'); }
    };
    for (const b of buttons) {
      const el = document.createElement('button');
      el.className = 'wbtn' + (b.primary ? ' primary' : '') + (b.danger ? ' danger' : '');
      el.textContent = b.label;
      el.onclick = e => { e.stopPropagation(); done(b.value); };
      box.append(el);
    }
    modal.onclick = e => { if (e.target === modal) done('cancel'); };
    modal.hidden = false;
    document.addEventListener('keydown', onKey, true);
    if (input) { input.focus(); input.setSelectionRange(0, input.value.replace(MD_RE, '').length); }
    else box.lastElementChild.focus();
  });
}
async function confirmDiscard() {
  // 저장 전 메모는 브라우저에 임시 보관되므로 다른 화면으로 가도 잃지 않는다
  if (S.cur?.node.draft) { clearTimeout(draftTimer); draftSet(S.cur.text); return true; }
  if (!S.dirty) return true;
  const v = await ask(t('unsavedQ', { name: S.cur.node.name }), t('unsavedSub'), [
    { label: t('cancel'), value: 'cancel' },
    { label: t('dontSave'), value: 'discard', danger: true },
    { label: t('save'), value: 'save', primary: true },
  ]);
  if (v === 'save') { await save(); return !S.dirty; }
  return v === 'discard';
}

async function discard() {
  if (!S.cur || !S.dirty) return;
  if (S.cur.node.draft) {
    const v = await ask(t('dropDraftQ'), t('dropDraftSub'), [
      { label: t('cancel'), value: 'cancel' },
      { label: t('dropDraftBtn'), value: 'drop', danger: true, primary: true },
    ]);
    if (v !== 'drop') return;
    clearTimeout(draftTimer);
    draftSet('');
    goHome();
    toast(t('discarded'));
    return;
  }
  const v = await ask(t('discardQ'), t('discardSub'), [
    { label: t('cancel'), value: 'cancel' },
    { label: t('discardBtn'), value: 'discard', danger: true, primary: true },
  ]);
  if (v !== 'discard') return;
  // 그사이 바깥에서 파일이 바뀌었다면 그 최신 내용으로 돌아간다
  if (S.ext != null) { S.cur.saved = S.ext; S.ext = null; $('#banner').hidden = true; }
  S.cur.text = S.cur.saved;
  setDirty(false);
  if (S.mode === 'edit') {
    const st = main.scrollTop;
    editor.value = S.cur.text; autosize(); schedulePreview();
    main.scrollTop = st;
  } else renderDoc(S.cur.text, { keepScroll: true });
  toast(t('discarded'));
}

async function openFile(node, { keepScroll = false } = {}) {
  if (S.cur && S.dirty) {
    if (await sameEntry(node.handle, S.cur.node.handle)) return true;
    if (!(await confirmDiscard())) return false;
  }
  let f, raw;
  try { f = await node.handle.getFile(); raw = await f.text(); }
  catch { toast(t('cantOpen')); return false; }
  S.cur = { node, path: node.path, eol: raw.includes('\r\n') ? '\r\n' : '\n', text: norm(raw), saved: norm(raw), mtime: f.lastModified };
  S.ext = null; S.screen = null; $('#banner').hidden = true;
  setDirty(false);
  if (S.mode === 'edit') { S.mode = 'read'; editor.hidden = true; document.body.classList.remove('editing'); }
  const parts = node.path.split('/');
  if (!node.single) for (let i = 1; i < parts.length; i++) S.open.add(parts.slice(0, i).join('/') + '/');
  await addRecent(node);
  lsSet(LAST_KEY, 'file');
  renderSide(); updateCrumb(); updateModeBtn();
  await renderDoc(S.cur.text, { keepScroll });
  if (!keepScroll) main.scrollTop = 0;
  $('#fnpop').hidden = true;
  return true;
}

// ── 새 메모 ──
const DRAFT_KEY = 'mdr-draft', LAST_KEY = 'mdr-last';
const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } };
const lsSet = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} };
const draftGet = () => lsGet(DRAFT_KEY);
const draftSet = v => lsSet(DRAFT_KEY, v);
let draftTimer;

async function newMemo() {
  if (S.cur?.node.draft) { if (S.mode !== 'edit') enterEdit({ line: 0, offsetY: 0 }); editor.focus(); return; }
  if (!(await confirmDiscard())) return;
  const text = draftGet();
  S.cur = { node: { kind: 'file', name: '', handle: null, path: '', single: true, draft: true }, path: '', eol: '\n', text, saved: '', mtime: 0 };
  S.ext = null; S.screen = null; $('#banner').hidden = true;
  if (S.mode === 'edit') { S.mode = 'read'; document.body.classList.remove('editing'); }
  setDirty(text !== '');
  lsSet(LAST_KEY, 'draft');
  renderSide(); updateCrumb();
  await renderDoc(text);
  enterEdit({ line: 0, offsetY: 0 });
  // 이어 쓰는 경우 맨 끝으로
  editor.setSelectionRange(text.length, text.length);
  if (text) main.scrollTop = main.scrollHeight;
}

// 첫 제목(또는 첫 줄)을 파일 이름으로 제안한다
function suggestName(text) {
  const line = (text.match(/^#{1,6}\s+(.+)$/m)?.[1] || text.split('\n').find(l => l.trim()) || '')
    .replace(/[*_`~[\]#>]/g, '').replace(/[\\/:*?"<>|]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 40).trim();
  return (line || t('untitled')) + '.md';
}

async function saveDraftAs() {
  const text = S.cur.text;
  let handle = null;
  if (S.root) {
    const opts = { input: suggestName(text) };
    const v = await ask(t('saveAsQ'), t('saveAsSub', { folder: S.root.name }), [
      { label: t('cancel'), value: 'cancel' },
      { label: t('saveElsewhere'), value: 'other' },
      { label: t('saveHere'), value: 'here', primary: true },
    ], opts);
    if (v === 'cancel') return false;
    if (v === 'here') {
      let name = (opts.value || '').replace(/[\\/:*?"<>|]/g, ' ').trim();
      if (!name) return false;
      if (!MD_RE.test(name)) name += '.md';
      let exists = false;
      try { await S.root.getFileHandle(name); exists = true; } catch {}
      if (exists && (await ask(t('overwriteQ', { name }), '', [
        { label: t('cancel'), value: 'cancel' },
        { label: t('overwrite'), value: 'ok', danger: true, primary: true },
      ])) !== 'ok') return false;
      if (!(await ensurePerm(S.root))) { toast(t('noWrite')); return false; }
      try { handle = await S.root.getFileHandle(name, { create: true }); }
      catch (e) { toast(t('saveFail', { msg: e.message })); return false; }
    }
  }
  if (!handle) {
    try {
      handle = await showSaveFilePicker({ id: 'mdr-file', suggestedName: suggestName(text), types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md'] } }] });
    } catch (e) {
      if (e.name !== 'AbortError') toast(t('saveFail', { msg: e.message }));
      return false;
    }
  }
  try {
    const w = await handle.createWritable();
    await w.write(text);
    await w.close();
  } catch (e) { toast(t('saveFail', { msg: e.message })); return false; }
  clearTimeout(draftTimer);
  draftSet('');
  lsSet(LAST_KEY, 'file');
  S.cur.node = { kind: 'file', name: handle.name, handle, path: handle.name, single: true };
  S.cur.saved = text;
  S.cur.mtime = (await handle.getFile()).lastModified;
  if (S.root) await refreshTree();
  else S.cur.node = await nodeFor(handle);
  S.cur.path = S.cur.node.path;
  await addRecent(S.cur.node);
  editor.placeholder = '';
  setDirty(S.cur.text !== S.cur.saved);
  renderSide(); updateCrumb();
  toast(t('saved'));
  return true;
}

async function save() {
  if (!S.cur) return;
  if (S.cur.node.draft) { await saveDraftAs(); return; }
  const h = S.cur.node.handle;
  try {
    if ((await h.queryPermission({ mode: 'readwrite' })) !== 'granted' &&
        (await h.requestPermission({ mode: 'readwrite' })) !== 'granted') {
      toast(t('noWrite')); return;
    }
    const text = S.cur.text;
    const w = await h.createWritable();
    await w.write(S.cur.eol === '\n' ? text : text.replace(/\n/g, S.cur.eol));
    await w.close();
    S.cur.mtime = (await h.getFile()).lastModified;
    S.cur.saved = text;
    S.ext = null; $('#banner').hidden = true;
    setDirty(S.cur.text !== S.cur.saved);
    toast(t('saved'));
  } catch (e) {
    toast(t('saveFail', { msg: e.message }));
  }
}

function setDirty(d) {
  S.dirty = d;
  document.body.classList.toggle('dirty', d);
  const name = S.cur?.node.draft ? t('draftName') : S.cur?.node.name;
  document.title = S.cur ? `${d ? '● ' : ''}${name} — ${t('appName')}` : t('appName');
}
function updateCrumb() {
  const c = $('#crumb');
  if (!S.cur) { c.innerHTML = ''; c.title = ''; return; }
  if (S.cur.node.draft) { c.innerHTML = `<b>${esc(t('draftName'))}</b>`; c.title = ''; return; }
  const parts = S.cur.path.split('/');
  const name = parts.pop();
  const dirs = (S.cur.node.single ? [] : [S.root.name, ...parts]).map(esc);
  c.innerHTML = (dirs.length ? `<span class="path-dir">${dirs.join('<span class="slash">/</span>')}<span class="slash">/</span></span>` : '') + `<b>${esc(name)}</b>`;
  c.title = S.cur.node.single ? name : [S.root.name, S.cur.path].join('/');
}

// 다른 곳(예: Claude)이 파일을 고치면 바로 반영
setInterval(async () => {
  if (!S.cur || document.hidden) return;
  let f;
  try { f = await S.cur.node.handle.getFile(); } catch { return; }
  if (f.lastModified === S.cur.mtime) return;
  const cur = S.cur;
  const text = norm(await f.text());
  if (cur !== S.cur) return;
  cur.mtime = f.lastModified;
  if (text === cur.saved) return;
  if (S.dirty) { S.ext = text; $('#banner').hidden = false; return; }
  cur.text = cur.saved = text;
  if (S.mode === 'read') renderDoc(text, { keepScroll: true });
  else {
    const st = main.scrollTop, pos = editor.selectionStart;
    editor.value = text; autosize(); schedulePreview();
    editor.setSelectionRange(pos, pos);
    main.scrollTop = st;
  }
}, 1500);

async function pickFile() {

  }
  const box = setScreen(showWelcome, `<div class="welcome">
    <h1>${esc(t('appName'))} <a class="ver-tag" href="${REPO}/blob/main/CHANGELOG.md" target="_blank" rel="noopener" title="${esc(t('tChangelog'))}">version ${VERSION}</a></h1>
    <p class="lead">${t('lead')}</p>
    <div class="actions">
      <button class="wbtn primary" id="w-file">${ICON.file}${esc(t('openFile'))}</button>
      <button class="wbtn" id="w-new">${ICON.pencil}${esc(t(draftGet() ? 'continueDraft' : 'newMemoLong'))}</button>
      <button class="wbtn" id="w-folder">${ICON.folder}${esc(t('openFolder'))}</button>
    </div>
    <p class="hint">${esc(t('dropHint'))}</p>
    <h2 class="features-title">${esc(t('featuresTitle'))}</h2>
    <div class="features">${FEATURES.map(([ic, k]) =>
      `<div class="feat"><div class="ic">${FEAT_ICON[ic]}</div><h3>${esc(t(k + 'T'))}</h3><p>${esc(t(k + 'D'))}</p></div>`).join('')}</div>
    ${S.recent.length ? `<div class="recent"><h2>${esc(t('recentTitle'))}</h2><div id="w-recent"></div></div>` : ''}
    <div class="keys">${keysHtml()}</div>
    <div class="credit">${creditHtml()}</div></div>`);
  box.querySelector('#w-file').onclick = pickFile;
  box.querySelector('#w-folder').onclick = pickFolder;
  box.querySelector('#w-new').onclick = newMemo;
  const list = box.querySelector('#w-recent');
  if (list) for (const e of S.recent.slice(0, 8)) list.append(recentRow(e, false));
}
function showFolderHome() {
  setScreen(showFolderHome, `<div class="welcome"><h1>${esc(S.root.name)}</h1>
    <p class="lead">${t('folderLead', { n: S.files.length })}</p><div class="keys">${keysHtml()}</div></div>`);
}

// ── 편집 모드 ──
function updateModeBtn() {
  const b = $('#btn-mode');
  b.disabled = !S.cur || !!S.screen;
  b.innerHTML = S.mode === 'edit' ? ICON.book + esc(t('read')) : ICON.pencil + esc(t('edit'));
  b.classList.toggle('on', S.mode === 'edit');
  document.body.classList.toggle('split', splitOn());
  $('#btn-preview').hidden = S.mode !== 'edit';
  $('#btn-preview').classList.toggle('on', splitOn());
}
function autosize() {
  const st = main.scrollTop;
  editor.style.height = 'auto';
  editor.style.height = editor.scrollHeight + 'px';
  main.scrollTop = st;
}
function lineOffset(text, line) {
  let off = 0;
  for (let i = 0; i < line; i++) {
    const j = text.indexOf('\n', off);
    if (j < 0) return text.length;
    off = j + 1;
  }
  return off;
}
const mirror = document.createElement('div');
mirror.className = 'mirror';
document.body.append(mirror);
function prepMirror() {
  const cs = getComputedStyle(editor);
  Object.assign(mirror.style, {
    width: (editor.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)) + 'px',
    fontFamily: cs.fontFamily, fontSize: cs.fontSize, fontWeight: cs.fontWeight,
    lineHeight: cs.lineHeight, letterSpacing: cs.letterSpacing, tabSize: cs.tabSize, wordBreak: cs.wordBreak,
  });
  mirror.textContent = 'x';
  return { pad: parseFloat(cs.paddingTop), lh: mirror.getBoundingClientRect().height };
}
// 편집기 안에서 line번째 줄의 세로 위치 (main 기준)
function editorLineTop(line, m = prepMirror()) {
  const off = lineOffset(editor.value, line);
  if (off === 0) return editor.offsetTop + m.pad;
  mirror.textContent = editor.value.slice(0, off) + 'x';
  return editor.offsetTop + m.pad + mirror.getBoundingClientRect().height - m.lh;
}
function topVisibleEditorLine() {
  const m = prepMirror();
  const target = main.scrollTop + 4;
  let lo = 0, hi = editor.value.split('\n').length - 1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (editorLineTop(mid, m) <= target) lo = mid; else hi = mid - 1;
  }
  return { line: lo, offsetY: editorLineTop(lo, m) - main.scrollTop };
}
function scrollEditorToLine(line, offsetY) {
  const off = lineOffset(editor.value, line);
  editor.setSelectionRange(off, off);
  main.scrollTop = editorLineTop(line) - offsetY;
  editor.focus({ preventScroll: true });
}
function topVisibleDocLine() {
  const top = main.getBoundingClientRect().top;
  for (const el of docEl.querySelectorAll('[data-line]')) {
    const r = el.getBoundingClientRect();
    if (r.bottom > top + 1 && r.height > 0) return { line: +el.dataset.line, offsetY: r.top - top };
  }
  return null;
}
function scrollDocToLine({ line, offsetY }) {
  let best = null;
  for (const el of docEl.querySelectorAll('[data-line]')) {
    if (+el.dataset.line <= line && el.getBoundingClientRect().height > 0) best = el;
  }
  if (!best) { main.scrollTop = 0; return; }
  main.scrollTop += best.getBoundingClientRect().top - main.getBoundingClientRect().top - offsetY;
}

function enterEdit(at = topVisibleDocLine()) {
  if (!S.cur || S.screen || S.mode === 'edit') return;
  S.mode = 'edit';
  document.body.classList.add('editing');
  $('#fnpop').hidden = true;
  editor.value = S.cur.text;
  editor.placeholder = S.cur.node.draft ? t('memoPh') : '';
  docEl.hidden = !prefs.preview;
  editor.hidden = false;
  updateModeBtn();
  autosize();
  scrollEditorToLine(at ? at.line : 0, at ? Math.max(at.offsetY, 0) : 0);
  syncPreview();
}
async function exitEdit() {
  if (S.mode !== 'edit') return;
  const at = topVisibleEditorLine();
  S.mode = 'read';
  document.body.classList.remove('editing');
  updateModeBtn();
  await renderDoc(S.cur.text);
  editor.hidden = true;
  docEl.hidden = false;
  scrollDocToLine(at);
  updateSpy();
}
const toggleMode = () => (S.mode === 'edit' ? exitEdit() : enterEdit());

editor.addEventListener('input', () => {
  S.cur.text = editor.value;
  setDirty(S.cur.text !== S.cur.saved);
  autosize();
  schedulePreview();
  if (S.cur.node.draft) {
    clearTimeout(draftTimer);
    const cur = S.cur;
    draftTimer = setTimeout(() => { if (cur.node.draft) { draftSet(cur.text); if (prefs.view === 'recent') renderRecent(); } }, 400);
  }
});
editor.addEventListener('keydown', e => {
  if (e.key === 'Tab' && !e.ctrlKey && !e.altKey && !e.shiftKey) {
    e.preventDefault();
    document.execCommand('insertText', false, '  ');
  }
});
main.addEventListener('dblclick', e => {
  if (!S.cur || S.screen || !docEl.contains(e.target)) return;
  if (S.mode !== 'read' && !splitOn()) return;
  if (e.target.closest('a, img, svg, button, input, .katex, summary')) return;
  const el = e.target.closest('[data-line]');
  if (!el) return;
  getSelection()?.removeAllRanges();
  const at = { line: +el.dataset.line, offsetY: el.getBoundingClientRect().top - main.getBoundingClientRect().top };
  // 미리보기에서 더블클릭하면 원문의 그 줄로 커서를 옮긴다
  if (splitOn()) scrollEditorToLine(at.line, Math.max(at.offsetY, 0));
  else enterEdit(at);
});

// ── 링크 · 각주 ──
function scrollToId(id) {
  const el = docEl.querySelector('#' + CSS.escape(id));
  if (el) main.scrollTop += el.getBoundingClientRect().top - main.getBoundingClientRect().top - 24;
}
main.addEventListener('click', async e => {
  const a = e.target.closest('a[href]');
  if (!a || !docEl.contains(a) || S.screen) return;
  const href = a.getAttribute('href');
  if (href.startsWith('#')) {
    e.preventDefault();
    let id = href.slice(1);
    try { id = decodeURIComponent(id); } catch {}
    scrollToId(id);
    return;
  }
  if (/^([a-z][a-z0-9+.-]*:|\/\/)/i.test(href)) return;
  e.preventDefault();
  if (!S.cur) return;
  if (S.cur.node.single) { toast(t('needFolder')); return; }
  const [p, hash] = href.split('#');
  const node = S.byPath.get(joinPath(S.cur.path, p));
  if (!node) { toast(t('notInList')); return; }
  if (await openFile(node) && hash) scrollToId(decodeURIComponent(hash));
});

const fnpop = $('#fnpop');
main.addEventListener('mouseover', e => {
  const a = e.target.closest('.footnote-ref a');
  if (!a || (S.mode !== 'read' && !splitOn())) return;
  let id = a.getAttribute('href').slice(1);
  try { id = decodeURIComponent(id); } catch {}
  const li = docEl.querySelector('#' + CSS.escape(id));
  if (!li) return;
  const c = li.cloneNode(true);
  c.querySelectorAll('.footnote-backref').forEach(x => x.remove());
  fnpop.innerHTML = c.innerHTML;
  fnpop.hidden = false;
  const r = a.getBoundingClientRect(), pr = fnpop.getBoundingClientRect();
  const left = Math.max(10, Math.min(r.left - 20, innerWidth - pr.width - 10));
  const below = r.bottom + 8 + pr.height < innerHeight;
  fnpop.style.left = left + 'px';
  fnpop.style.top = (below ? r.bottom + 8 : r.top - pr.height - 8) + 'px';
});
main.addEventListener('mouseout', e => { if (e.target.closest('.footnote-ref a')) fnpop.hidden = true; });
main.addEventListener('scroll', () => { fnpop.hidden = true; });

// ── 글자 크기 · 테마 · 언어 · 보기 설정 ──
function setSize(v) {
  const at = S.mode === 'read' && S.cur && !S.screen ? topVisibleDocLine() : null;
  prefs.size = Math.max(12, Math.min(32, v));
  savePrefs(); applyPrefs();
  if (at) scrollDocToLine(at);
}
const bump = d => setSize(d === 0 ? DEFAULTS.size : prefs.size + d);
$('#btn-smaller').onclick = () => bump(-1);
$('#btn-bigger').onclick = () => bump(1);

function onThemeChange() {
  applyPrefs();
  if (S.cur && !S.screen && S.mode === 'read' && docEl.querySelector('.mermaid-block')) renderDoc(S.cur.text, { keepScroll: true });
}
function setLang(l) {
  prefs.lang = l; savePrefs();
  applyPrefs(); applyLang();
}
$('#btn-theme').onclick = () => {
  prefs.theme = { light: 'dark', dark: 'custom', custom: 'light' }[theme()];
  savePrefs(); onThemeChange();
};

// ── 내 색 · 직접 고른 글꼴 ──
$('#swatches').innerHTML = SWATCHES.map(([k, bg, text]) =>
  `<button data-bg="${bg}" data-text="${text}" data-i18n-title="${k}" style="background:${bg};color:${text}">가 Aa</button>`).join('');
function setCustomColors(c, rerender) {
  prefs.custom = { ...prefs.custom, ...c };
  savePrefs();
  if (rerender) onThemeChange(); else applyPrefs();
}
$('#c-bg').addEventListener('input', e => setCustomColors({ bg: e.target.value }));
$('#c-text').addEventListener('input', e => setCustomColors({ text: e.target.value }));
$('#c-bg').addEventListener('change', e => setCustomColors({ bg: e.target.value }, true));
$('#swatches').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) setCustomColors({ bg: b.dataset.bg, text: b.dataset.text }, true);
});
$('#font-name').addEventListener('input', e => { prefs.customFont = e.target.value; savePrefs(); applyPrefs(); });
$('#font-load').onclick = async () => {
  try {
    const fonts = await window.queryLocalFonts();
    const fams = [...new Set(fonts.map(f => f.family))].sort((a, b) => a.localeCompare(b, 'ko'));
    if (!fams.length) throw new Error('empty');
    $('#font-list').innerHTML = fams.map(f => `<option value="${esc(f)}">`).join('');
    toast(t('fontLoaded', { n: fams.length }));
    $('#font-name').focus();
  } catch { toast(t('fontLoadFail')); }
};
$('#btn-lang').onclick = () => setLang(prefs.lang === 'ko' ? 'en' : 'ko');
darkMQ.addEventListener('change', () => { if (!prefs.theme) onThemeChange(); });

$('#btn-sidebar').onclick = () => { prefs.sidebar = !prefs.sidebar; savePrefs(); applyPrefs(); };
$('#btn-sidebar-close').onclick = () => { prefs.sidebar = false; savePrefs(); applyPrefs(); };

async function goHome() {
  if (S.screen === showWelcome) return;
  if (!(await confirmDiscard())) return;
  if (S.mode === 'edit') { S.mode = 'read'; document.body.classList.remove('editing'); }
  S.cur = null; S.ext = null; $('#banner').hidden = true;
  setDirty(false); updateCrumb(); renderSide();
  showWelcome();
  main.scrollTop = 0;
}
$('#btn-home').onclick = goHome;

const about = $('#about');
function openAbout() {
  pop.hidden = true;
  $('#about-body').innerHTML = aboutHtml();
  about.hidden = false;
  $('#about-close').focus();
}
const closeAbout = () => { about.hidden = true; };
$('#btn-about').onclick = openAbout;
$('#sb-ver').onclick = openAbout;
$('#about-close').onclick = closeAbout;
about.addEventListener('click', e => { if (e.target === about) closeAbout(); });
document.addEventListener('click', e => {
  const a = e.target.closest('[data-about]');
  if (a) { e.preventDefault(); e.stopPropagation(); openAbout(); }
}, true);
$('#btn-toc').onclick = () => { prefs.toc = !prefs.toc; savePrefs(); applyPrefs(); };
$('#btn-mode').onclick = toggleMode;
$('#btn-save').onclick = save;
$('#btn-discard').onclick = discard;
$('#btn-open-file').onclick = pickFile;
$('#btn-new').onclick = newMemo;
$('#btn-preview').onclick = togglePreview;
$('#btn-open-folder').onclick = pickFolder;
$('#btn-refresh').onclick = async () => { await refreshTree(); toast(t('refreshed')); };

const pop = $('#settings');
$('#btn-settings').onclick = e => {
  e.stopPropagation();
  if (!pop.hidden) { pop.hidden = true; return; }
  pop.hidden = false;
  const r = $('#btn-settings').getBoundingClientRect();
  pop.style.top = (r.bottom + 6) + 'px';
  pop.style.left = Math.max(10, Math.min(r.right - pop.offsetWidth, innerWidth - pop.offsetWidth - 10)) + 'px';
};
pop.addEventListener('click', e => {
  e.stopPropagation();
  const sz = e.target.closest('[data-size]');
  if (sz) { bump(+sz.dataset.size); return; }
  const b = e.target.closest('.seg button');
  if (!b) return;
  const key = b.parentElement.dataset.pref;
  if (key === 'lang') { setLang(b.dataset.val); return; }
  prefs[key] = key === 'theme' && b.dataset.val === 'system' ? null : b.dataset.val;
  savePrefs();
  if (key === 'theme') onThemeChange(); else applyPrefs();
});
document.addEventListener('click', () => { pop.hidden = true; fnpop.hidden = true; });

// ── 단축키 ──
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === 's') { e.preventDefault(); if (S.cur) save(); }
  else if (mod && k === 'e') { e.preventDefault(); toggleMode(); }
  else if (mod && (k === '=' || k === '+')) { e.preventDefault(); bump(1); }
  else if (mod && k === '-') { e.preventDefault(); bump(-1); }
  else if (mod && k === '0') { e.preventDefault(); bump(0); }
  else if (mod && k === 'o') { e.preventDefault(); e.shiftKey ? pickFolder() : pickFile(); }
  else if (e.altKey && !mod && k === 'n') { e.preventDefault(); newMemo(); }
  else if (e.altKey && !mod && k === 'p') { e.preventDefault(); togglePreview(); }
  else if (mod && k === '\\') { e.preventDefault(); $('#btn-sidebar').click(); }
  else if (e.key === 'Escape') {
    if (!about.hidden) closeAbout();
    else if (!pop.hidden) pop.hidden = true;
    else if (S.mode === 'edit') exitEdit();
  }
});
window.addEventListener('wheel', e => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  bump(e.deltaY < 0 ? 1 : -1);
}, { passive: false });
window.addEventListener('beforeunload', e => {
  if (S.cur?.node.draft) { draftSet(S.cur.text); return; }   // 메모는 임시 보관되므로 묻지 않는다
  if (S.dirty) { e.preventDefault(); e.returnValue = ''; }
});
let resizeTimer;
window.addEventListener('resize', () => {
  if (prefs.ui !== 'auto') return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(applyPrefs, 150);
});
let focusTimer;
window.addEventListener('focus', () => { clearTimeout(focusTimer); focusTimer = setTimeout(refreshTree, 300); });

// ── 끌어다 놓기 ──
window.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dropping'); });
window.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dropping'); });
window.addEventListener('drop', async e => {
  e.preventDefault();
  document.body.classList.remove('dropping');
  const item = [...e.dataTransfer.items].find(i => i.kind === 'file');
  if (!item?.getAsFileSystemHandle) return;
  const h = await item.getAsFileSystemHandle();
  if (!h) return;
  if (h.kind === 'directory') { await loadRoot(h); return; }
  if (!/\.(md|markdown|txt)$/i.test(h.name)) { toast(t('dropOnly')); return; }
  prefs.view = 'recent'; savePrefs();
  await openFile(await nodeFor(h));
});

// ── 기타 ──
let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

// 최근 파일과 지난번 폴더를 기억하기 위한 IndexedDB
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('md-reader', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function kvSet(k, v) {
  try {
    const db = await idb();
    db.transaction('kv', 'readwrite').objectStore('kv').put(v, k);
  } catch {}
}
async function kvGet(k) {
  try {
    const db = await idb();
    return await new Promise((res, rej) => {
      const r = db.transaction('kv').objectStore('kv').get(k);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  } catch { return null; }
}
async function granted(h) {
  try { return (await h.queryPermission({ mode: 'readwrite' })) === 'granted'; } catch { return false; }
}

async function init() {
  applyPrefs(); applyLang();
  if (!('showOpenFilePicker' in window)) { showWelcome(); return; }
  S.recent = (await kvGet('recent')) || [];
  S.savedRoot = await kvGet('root');
  if (S.savedRoot && await granted(S.savedRoot)) await loadRoot(S.savedRoot, { quiet: true });
  renderSide();
  if (lsGet(LAST_KEY) === 'draft' && draftGet()) { await newMemo(); return; }
  const last = S.recent[0];
  if (last && await granted(last.handle)) {
    try { await last.handle.getFile(); await openFile(await nodeFor(last.handle)); return; } catch {}
  }
  showWelcome();
}
init();
})();
